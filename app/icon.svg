<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="GlobalHire Calc">
  <defs>
    <linearGradient id="ghc-bg" x1="8" y1="4" x2="92" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b5bff"/>
      <stop offset="0.55" stop-color="#2553eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="ghc-shine" cx="22" cy="14" r="62" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ghc-orbit" x1="13" y1="76" x2="82" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <clipPath id="ghc-globe"><circle cx="46" cy="50" r="23"/></clipPath>
  </defs>
  <rect width="96" height="96" rx="24" fill="url(#ghc-bg)"/>
  <rect width="96" height="96" rx="24" fill="url(#ghc-shine)"/>
  <!-- cross-border orbit sweeping around the globe -->
  <path d="M13 73 C 42 93, 80 81, 81 36" fill="none" stroke="url(#ghc-orbit)" stroke-width="5" stroke-linecap="round"/>
  <!-- globe -->
  <circle cx="46" cy="50" r="23" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-width="4.5"/>
  <ellipse cx="46" cy="50" rx="10" ry="23" fill="none" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <line x1="23" y1="44" x2="69" y2="44" stroke="#ffffff" stroke-opacity="0.5" stroke-width="3"/>
  <!-- rising cost bars, clipped to the globe -->
  <g clip-path="url(#ghc-globe)" fill="#ffffff">
    <rect x="33" y="58" width="7" height="20" rx="2"/>
    <rect x="43" y="51" width="7" height="27" rx="2"/>
    <rect x="53" y="42" width="7" height="36" rx="2"/>
  </g>
  <circle cx="81" cy="29" r="7" fill="#fbbf24" stroke="#ffffff" stroke-width="3"/>
</svg>
